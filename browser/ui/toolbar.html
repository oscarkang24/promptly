<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="base.css">
<style>
  body { display:flex; flex-direction:column; overflow:hidden; user-select:none; }
  body.private { --bar:#2a2140; --tab:#3a2f57; --tab-on:#4a3d6e; --fg:#f2eefc; --muted:#c7bce6; --input:#3a2f57; --line:#54487a; }
  #tabs { display:flex; gap:2px; height:36px; padding:4px 6px 0; align-items:flex-end; overflow-x:auto; scrollbar-width:none; }
  .tab { display:flex; align-items:center; gap:6px; min-width:80px; max-width:220px; flex:1 1 180px; height:32px; padding:0 6px 0 10px;
    background:var(--tab); border-radius:8px 8px 0 0; cursor:default; }
  .tab.on { background:var(--tab-on); }
  .tab.agent { box-shadow: inset 0 2px 0 var(--agent); }
  .tab img { width:14px; height:14px; }
  .tab .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tab .x { padding:0 5px; border-radius:4px; color:var(--muted); }
  .badge { font-size:10px; padding:0 5px; border-radius:4px; background:var(--agent-bg); color:var(--agent); font-weight:600; }
  #new { height:28px; margin-bottom:2px; }
  #nav { display:flex; gap:4px; align-items:center; height:48px; padding:0 8px; background:var(--tab-on); border-bottom:1px solid var(--line); }
  #addr { flex:1; }
  #mem.on { color:var(--accent); background:var(--tab); }
  #priv { color:var(--muted); font-size:12px; padding:0 6px; }
</style></head>
<body>
  <div id="tabs"></div>
  <div id="nav">
    <button id="back" title="Back">←</button>
    <button id="fwd" title="Forward">→</button>
    <button id="reload" title="Reload">↻</button>
    <input id="addr" placeholder="Search or enter address" spellcheck="false">
    <span id="priv" hidden>private · nothing is remembered</span>
    <button id="drive" title="Let an agent click and type in this tab" hidden>🤖 Let agent drive</button>
    <button id="mem" title="Memory panel (Ctrl+Shift+M)">✦ Memory</button>
  </div>
<script src="toolbar.js"></script>
</body></html>
